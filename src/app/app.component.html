<div class="background" [ngStyle]="{ 'background-image': backgroundStyle }">
  <app-toolbar class="toolbar"></app-toolbar>
  <app-bookmarks class="bookmarks"></app-bookmarks>
  <app-clock class="clock"></app-clock>
  @if (settings.weather.show) {
    <app-weather-widget
      class="weather"
    ></app-weather-widget>
  }
  <app-search-bar class="search"></app-search-bar>
</div>
